<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Get elements by classnames</title>
  </head>
  <body>
    <nav class="block">
      <p class="paragraph">Welcome to my website</p>
    </nav>
    <div>
      <div>
        <h3>This is div2</h3>
      </div>
    </div>
    <div class="block">
      <h2>
        Hello there my name is
        <span id="username" class="redColor">Shouvik Sarkar</span> :)
      </h2>
      <p class="paragraph">Here is a code for you</p>
      <pre><code>console.log("Hello there!")</code></pre>
    </div>

    <script>
      const classElements = document.getElementsByClassName("paragraph");

      for (let i = 0; i < classElements.length; i++) {
        console.log(classElements.item(i));
        classElements.item(i).style.background = "grey";
        classElements.item(i).remove();
      }
    </script>
  </body>
</html>
